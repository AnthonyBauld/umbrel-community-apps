description: >-
  Rotki is an open-source portfolio tracking, analytics, accounting, and management application that respects your financial privacy. Unlike traditional financial tools that send your sensitive data to remote servers, Rotki stores all your financial history locally and encrypted on your device.

  Key Features:
  • Multi-chain & Exchange Tracking: Connect Ethereum, Bitcoin, major L2s, and top crypto exchanges via API.
  • DeFi Analytics: Track your positions, staking yields, liquidity pools, and lending balances in real-time.
  • Privacy First: Zero data collection, tracking, or third-party telemetry.
  • Tax & Accounting: Generate tax reports, profit/loss statements, and track cost basis with full transaction history.
