version: "3.7"

services:
  app_proxy:
    image: getumbrel/app-proxy:v1.0.0
    restart: on-failure
    environment:
      APP_HOST: anthonybauld-rotki_anthonybauld-rotki_1
      APP_PORT: 8080

  anthonybauld-rotki:
    image: rotki/rotki:v1.36.0
    restart: on-failure
    volumes:
      - ${APP_DATA_DIR}/data:/root/.rotki
    environment:
      - ROTKI_DATA_DIR=/root/.rotki
