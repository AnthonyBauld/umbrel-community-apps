description: |
  Aggr is a real-time cryptocurrency trade aggregator and charting platform that aggregates tick-by-tick trades, orderbook depth, and liquidations across major exchanges including Binance, Bybit, Coinbase, and BitMEX into a unified interface.

  Use Aggr to monitor live trade flows, track cumulative volume delta, and set custom audio and visual thresholds for block trades and liquidation events.

  ## What It Does

    - **Consolidated market data** - Monitor live trade flow and liquidations across multiple centralized exchanges.

    - **Advanced visualizations** - Track cumulative volume delta (CVD), open interest, and custom volume profiles.

    - **Configurable alerts** - Set audio and visual thresholds for large block trades and liquidation events.

    - **Modular workspace** - Build custom layouts, chart panels, and indicator combinations.
